<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a1f" />
      <stop offset="60%" stop-color="#142646" />
      <stop offset="100%" stop-color="#2a4563" />
    </linearGradient>

    <!-- Beam Gradients -->
    <linearGradient id="beamLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff9d6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fff9d6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff9d6" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Lantern -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#ffd166" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Moon -->
  <circle cx="650" cy="120" r="40" fill="#fdfae2" opacity="0.9" />
  <circle cx="635" cy="105" r="8" fill="#e3dfc4" opacity="0.3" />
  <circle cx="660" cy="135" r="12" fill="#e3dfc4" opacity="0.3" />
  <circle cx="670" cy="110" r="6" fill="#e3dfc4" opacity="0.3" />

  <!-- Stars with Twinkle Animation -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="150" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="220" r="1">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="70" r="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="320" cy="280" r="1.5">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="550" cy="200" r="1.5">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="160" r="2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="710" cy="280" r="1.2">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Far Background Waves -->
  <path d="M-200,480 Q-100,460 0,480 T200,480 T400,480 T600,480 T800,480 T1000,480 L1000,600 L-200,600 Z" fill="#142646">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0; 0,0" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Island / Rock Base -->
  <path d="M280,600 L320,490 Q340,470 400,470 Q460,470 480,490 L520,600 Z" fill="#1c191c" />
  <path d="M300,600 L330,510 Q350,490 390,490 L390,600 Z" fill="#2d292d" />

  <!-- Lighthouse Base and Body -->
  <!-- Main white body -->
  <polygon points="360,480 440,480 420,200 380,200" fill="#f1faee" />
  
  <!-- Red Stripes -->
  <polygon points="368,400 432,400 426,330 374,330" fill="#e63946" />
  <polygon points="376,260 424,260 418,200 382,200" fill="#e63946" />
  
  <!-- Shadow overlay for cylindrical 3D effect -->
  <polygon points="400,480 440,480 420,200 400,200" fill="#000000" opacity="0.15" />

  <!-- Gallery Deck (Balcony) -->
  <rect x="365" y="190" width="70" height="10" fill="#2b2d42" rx="3" />
  <path d="M365,190 L365,175 M375,190 L375,175 M385,190 L385,175 M395,190 L395,175 M405,190 L405,175 M415,190 L415,175 M425,190 L425,175" stroke="#2b2d42" stroke-width="2" />
  <rect x="360" y="173" width="80" height="3" fill="#2b2d42" />

  <!-- Lantern Room -->
  <polygon points="378,190 422,190 415,135 385,135" fill="#fff5cc" />
  <circle cx="400" cy="165" r="45" fill="url(#glow)" opacity="0.6" />
  
  <!-- Lantern Glass Panes (Lines) -->
  <line x1="390" y1="190" x2="393" y2="135" stroke="#2b2d42" stroke-width="3" />
  <line x1="400" y1="190" x2="400" y2="135" stroke="#2b2d42" stroke-width="3" />
  <line x1="410" y1="190" x2="407" y2="135" stroke="#2b2d42" stroke-width="3" />

  <!-- Roof/Dome -->
  <path d="M375,135 Q400,105 425,135 Z" fill="#e63946" />
  <rect x="397" y="100" width="6" height="15" fill="#2b2d42" />
  <circle cx="400" cy="98" r="4" fill="#2b2d42" />
  
  <!-- Roof Shadow -->
  <path d="M400,135 Q412,118 425,135 Z" fill="#000000" opacity="0.2" />

  <!-- Light Beams (Animated Group) -->
  <g>
    <!-- Left Beam -->
    <polygon points="400,165 -150,50 -250,280" fill="url(#beamLeft)" />
    <!-- Right Beam -->
    <polygon points="400,165 950,50 1050,280" fill="url(#beamRight)" />
    
    <!-- Sweeping Rotation Animation -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      values="-12 400 165; 12 400 165; -12 400 165" 
      dur="6s" 
      repeatCount="indefinite" 
      calcMode="easeInOut"
    />
  </g>

  <!-- Mid-Ground Waves -->
  <path d="M-200,510 Q-100,480 0,510 T200,510 T400,510 T600,510 T800,510 T1000,510 L1000,600 L-200,600 Z" fill="#1d3557" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="-200,0; 0,0; -200,0" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Foreground Waves -->
  <path d="M-200,550 Q-100,510 0,550 T200,550 T400,550 T600,550 T800,550 T1000,550 L1000,600 L-200,600 Z" fill="#457b9d">
    <animateTransform attributeName="transform" type="translate" values="0,0; -200,0; 0,0" dur="4s" repeatCount="indefinite" />
  </path>
</svg>
